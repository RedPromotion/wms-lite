name: Deploy React Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'wms-lite-user-web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'wms-lite-user-web/package-lock.json'

      - name: Install dependencies
        run: |
          cd wms-lite-user-web
          npm ci

      - name: Build React App
        run: |
          cd wms-lite-user-web
          npm run build
        env:
          VITE_API_BASE_URL: https://wms-lite-production.up.railway.app

      - name: Copy index.html to 404.html for SPA Routing
        run: |
          cp wms-lite-user-web/dist/index.html wms-lite-user-web/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wms-lite-user-web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
