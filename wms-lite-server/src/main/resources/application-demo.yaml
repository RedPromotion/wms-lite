spring:
  config:
    activate:
      on-profile: demo

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:wms_lite_demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

logging:
  level:
    root: INFO
    com.wms.wms_lite: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  seed-data:
    enabled: true
    mode: open
  demo-login:
    enabled: true
