# ============================================================
# Railway 배포 설정 파일
# ============================================================
# 이 배포 설정은 공개 포트폴리오 데모용입니다.
# Railway에서는 H2 demo 프로파일을 사용하고, Neon/PostgreSQL은 application-prod.yaml에 보존합니다.
# ============================================================

[build]
# Gradle Wrapper로 빌드 (Java 21)
builder = "NIXPACKS"
buildCommand = "./gradlew clean bootJar -x test"
nixpacksJdkVersion = "21"

[build.environment]
NIXPACKS_JDK_VERSION = "21"

[deploy]
# 빌드된 JAR 실행 및 JVM 메모리 제한 옵션 적용 (-Xms128m -Xmx384m)
# 사유: Spring Boot 기본 JVM의 과도한 램 점유(1GB+)를 방지하여 Railway $5.00 무료 크레딧 한도 내에서 24시간 365일 무료 가동하기 위함.
startCommand = "java -Xms128m -Xmx384m -Dserver.address=0.0.0.0 -Dserver.port=8080 -Dspring.profiles.active=demo -jar build/libs/wms-lite-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
